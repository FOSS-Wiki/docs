map $uri $dl_header {
    ~/$      "";
    default  attachment;
}

server {
    server_name YOURDOMAIN;
    root /opt/mirror;

    location / {
        index _no_index_file_;
        default_type application/octet-stream;
        add_header Content-Disposition $dl_header;
        add_header X-Content-Type-Options nosniff;

        fancyindex on;
        fancyindex_exact_size off;
        fancyindex_localtime on;
        fancyindex_header /_header.html;
        fancyindex_footer /_index.html;
        try_files $uri $uri/ =404;
    }

    location = /_header.html { internal; alias /etc/nginx/wiki-archive/header.html; }
    location = /_index.html   { internal; alias /etc/nginx/wiki-archive/index.html; }
}
